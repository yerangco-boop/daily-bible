<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘의 말씀 준비 중</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --charcoal:#2E2B27; --paper:#F4F1E9; --tangerine:#E07A2E; --charcoal-soft:#5A5548;
  }
  @media (prefers-color-scheme: dark){
    :root{ --charcoal:#EDE8DE; --paper:#1B1916; --tangerine:#F0964C; --charcoal-soft:#C9C2B4; }
  }
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--charcoal);
    font-family:'Gowun Dodum', -apple-system, sans-serif;
    text-align:center; padding:24px;
  }
  .box{ max-width:320px; }
  h1{ font-family:'Gowun Batang',serif; font-size:20px; margin:0 0 10px; }
  p{ font-size:13.5px; color:var(--charcoal-soft); line-height:1.7; margin:0; }
  .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--tangerine);
    margin:18px auto;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:.35; transform:scale(.85);} 50%{ opacity:1; transform:scale(1);} }
  .err{ color:#B23B3B; font-size:13px; margin-top:14px; }
</style>
</head>
<body>
  <div class="box">
    {% if status == "error" %}
      <h1>불러오지 못했습니다</h1>
      <p>오늘의 말씀을 가져오는 중 문제가 생겼습니다. 잠시 후 새로고침해 주세요.</p>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% else %}
      <div class="dot"></div>
      <h1>오늘의 말씀 준비 중</h1>
      <p>성경본문을 가져오고 묵상해설 음성을 글로 옮기고 있어요. 보통 1~2분,
      느릴 때는 5분 정도 걸릴 수 있어요. 음성 변환이 오래 걸리면 스크립트
      없이 나머지 내용부터 보여드립니다.</p>
    {% endif %}
  </div>
  <script>
    // 처리 중일 때만 자동으로 상태를 확인해 완료되면 새로고침
    if ("{{ status }}" === "processing") {
      var tries = 0;
      var timer = setInterval(function () {
        tries += 1;
        fetch("/status").then(function (r) { return r.json(); }).then(function (d) {
          if (d.ready || d.status === "error") {
            clearInterval(timer);
            location.reload();
          }
        }).catch(function () {});
        if (tries > 100) { clearInterval(timer); } // 최대 약 8~9분 후 폴링 중단
      }, 5000);
    }
  </script>
</body>
</html>
